<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Druckansicht</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" />
    <link rel="icon" href="favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <style id="page-size"></style>
    <script type="module" src="/src/print.js"></script>
  </head>
  <body>
    <form id="tools" class="tools" action="#">
      <a href="index.html">Zur Karte</a>
      <label>Papier
        <select id="format"><option>A4</option><option>A3</option><option>A2</option><option>A1</option><option>A0</option></select>
      </label>
      <label>Ausrichtung
        <select id="orientation"><option value="portrait">hoch</option><option value="landscape">quer</option></select>
      </label>
      <button type="button" id="print">Drucken</button>
      <button type="button" id="png">Als PNG speichern</button>
    </form>
    <main id="sheet" class="sheet">
      <header>
        <h1 id="title"></h1>
        <p id="date"></p>
      </header>
      <div id="printmap" class="printmap"></div>
      <footer>
        <ul id="legend" class="legend"></ul>
        <p class="sources">
          Kartenmaterial: © OpenStreetMap-Mitwirkende (ODbL), Kacheln: OpenStreetMap Deutschland ·
          <span id="zone_credit"></span> ·
          Programm: © 2015, Neuaufbau 2026 KLUPEA GmbH
        </p>
      </footer>
    </main>
  </body>
</html>
